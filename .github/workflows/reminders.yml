name: Daily reminders

on:
  schedule:
    - cron: "2 * * * *" # backup only: often hours late. scheduler/worker.js is the on-time trigger
  workflow_dispatch:
    inputs:
      type:
        description: auto sends only what is due this hour; the others send to every device right now
        type: choice
        options: [auto, morning, midday, evening]
        default: auto

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci
        working-directory: push
      - run: node send.mjs
        working-directory: push
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          FORCE_TYPE: ${{ inputs.type != 'auto' && inputs.type || '' }}
